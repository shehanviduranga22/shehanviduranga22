<svg width="560" height="250" viewBox="0 0 560 250" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#081526"></stop>
    <stop offset="100%" stop-color="#0d2035"></stop>
  </linearGradient>

  <linearGradient id="accent" x1="0" x2="1">
    <stop offset="0%" stop-color="#00d9ff"></stop>
    <stop offset="100%" stop-color="#0077ff"></stop>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="blur"></feGaussianBlur>
    <feMerge>
      <feMergeNode in="blur"></feMergeNode>
      <feMergeNode in="SourceGraphic"></feMergeNode>
    </feMerge>
  </filter>
</defs>

<rect width="560" height="250" rx="22" fill="url(#bg)"></rect>
